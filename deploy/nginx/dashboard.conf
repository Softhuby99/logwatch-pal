# Internal nginx inside the dashboard container – serves the SPA
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy /sso/ → Authentik (bypasses CORS, same-origin for browser)
  location /sso/ {
    proxy_pass https://192.168.3.12:9443/;
    proxy_ssl_verify off;
    proxy_set_header Host 192.168.3.12:9443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Reverse-proxy /api/ → dashboard API container
  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # Cache hashed assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
