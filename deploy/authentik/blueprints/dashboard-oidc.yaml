# Authentik blueprint – auto-applied on first start.
# Creates an OIDC provider + application "dashboard" with the standard scopes.
# Federated sources (Google / Microsoft / SAML) are configured in the Authentik
# UI per README-SSO.md and are intentionally NOT defined here so that the
# secrets never leave your instance.

version: 1
metadata:
  name: dashboard-oidc

entries:
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: dashboard-oidc
    attrs:
      client_type: confidential
      client_id: !Env [OIDC_CLIENT_ID, dashboard]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      redirect_uris: |
        http://${HOSTNAME}/auth/callback
        https://${HOSTNAME}/auth/callback
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=5
      access_token_validity: minutes=60
      refresh_token_validity: days=30

  - model: authentik_core.application
    identifiers:
      slug: dashboard
    attrs:
      name: Security Dashboard
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, dashboard-oidc]]
      meta_launch_url: https://${HOSTNAME}/
      open_in_new_tab: false
      policy_engine_mode: any
