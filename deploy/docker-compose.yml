# Dashboard self-hosted stack
# Requires: Docker Engine 24+, docker compose v2

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
  AUTHENTIK_REDIS__HOST: authentik-redis
  AUTHENTIK_POSTGRESQL__HOST: authentik-db
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
  AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
  AUTHENTIK_BOOTSTRAP_EMAIL: ${ADMIN_EMAIL}

services:
  # ---------- Dashboard data ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_USER}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Dashboard API (MariaDB → JSON) ----------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      MARIADB_HOST: ${MARIADB_HOST:-logserver-db}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_USER: ${MARIADB_USER:-loguser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-logpass123}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-logdb}
      PORT: "3001"
      SSH_KEY_DIR: /home/node/.ssh
      SSH_KEY_NAME: id_ed25519_dashboard
    volumes:
      - api_ssh:/home/node/.ssh
    # Attach to the same docker network as your MariaDB container so DNS
    # resolves the container name set in MARIADB_HOST. Configure the network
    # name via LOGDB_NETWORK in .env (e.g. logserver_default).
    networks:
      - default
      - logdb_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------- Log server placeholder ----------
  # Replace `image:` with your actual log collector. Mounts ./logs as volume
  # and runs as LOG_SRV_UID:LOG_SRV_GID (defaults: 1001:1001 = `logcollector`).
  logsrv:
    image: alpine:3.20
    restart: unless-stopped
    user: "${LOG_SRV_UID:-1001}:${LOG_SRV_GID:-1001}"
    command: ["sh", "-c", "echo 'Replace this service with your log collector'; tail -f /dev/null"]
    volumes:
      - ./logs:/var/log/dashboard

  # ---------- Dashboard (React build via nginx) ----------
  # When INSTALL_PROXY=false, the dashboard binds DASHBOARD_PORT directly on
  # the host so an external reverse proxy (e.g. OPNsense Nginx) can target it.
  # When INSTALL_PROXY=true (default), only the bundled `proxy` service exposes
  # ports and the dashboard stays on the internal docker network.
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        VITE_AUTH_REQUIRED: ${VITE_AUTH_REQUIRED}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI}
        VITE_OIDC_POST_LOGOUT_URI: ${VITE_OIDC_POST_LOGOUT_URI}
        VITE_SSO_GOOGLE_ENABLED: ${VITE_SSO_GOOGLE_ENABLED}
        VITE_SSO_MICROSOFT_ENABLED: ${VITE_SSO_MICROSOFT_ENABLED}
        VITE_SSO_SAML_ENABLED: ${VITE_SSO_SAML_ENABLED}
        VITE_SSO_OIDC_ENABLED: ${VITE_SSO_OIDC_ENABLED}
        VITE_SSO_PASSWORD_ENABLED: ${VITE_SSO_PASSWORD_ENABLED}
    restart: unless-stopped
    # Dashboard port is published only when INSTALL_PROXY=false (external proxy
    # mode). When the bundled proxy runs, leave DASHBOARD_PORT unset/empty and
    # this binding becomes a no-op via docker compose's "ignore empty" rule
    # (we set 127.0.0.1 to make the binding harmless if the var is set).
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  # ---------- Authentik (SSO) ----------
  # Only started when INSTALL_AUTHENTIK=true (compose profile "authentik").
  # If you point AUTHENTIK_URL to an existing Authentik instance, leave the
  # COMPOSE_PROFILES env var unset and these services stay dormant.
  authentik-db:
    image: postgres:16-alpine
    profiles: ["authentik"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      POSTGRES_DB: authentik
    volumes:
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: redis:7-alpine
    profiles: ["authentik"]
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data

  authentik:
    image: ghcr.io/goauthentik/server:2024.10
    profiles: ["authentik"]
    restart: unless-stopped
    command: server
    environment: *authentik-env
    # Published only when INSTALL_PROXY=false; default bind 127.0.0.1 keeps
    # this safe when the bundled proxy is in front.
    ports:
      - "${AUTHENTIK_BIND:-127.0.0.1}:${AUTHENTIK_PORT:-9000}:9000"
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - authentik-media:/media
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    profiles: ["authentik"]
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    user: root
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - authentik-media:/media
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started

  # ---------- Reverse proxy (bundled, optional) ----------
  # Only started when INSTALL_PROXY=true (compose profile "proxy").
  # Disable by setting INSTALL_PROXY=false in .env to use an external reverse
  # proxy (e.g. OPNsense Nginx, Traefik, Caddy on another host).
  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "${SERVER_IP:-0.0.0.0}:80:80"
      - "${SERVER_IP:-0.0.0.0}:443:443"
    environment:
      AUTHENTIK_PROXY_PASS: ${AUTHENTIK_PROXY_PASS:-http://authentik:9000/}
      HOSTNAME: ${HOSTNAME}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${CERT_PATH:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - dashboard
      # authentik is optional (compose profile). proxy proxies to it if present.

  # ---------- Backup ----------
  backup:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      BACKUP_CRON: ${BACKUP_CRON}
    volumes:
      - ${BACKUP_PATH}:/backups
      - ./logs:/var/log/dashboard:ro
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      - db
      # authentik-db only present with profile "authentik" — backup script handles absence.

volumes:
  db-data:
  authentik-db:
  authentik-redis:
  authentik-media:
  api_ssh:

networks:
  default:

